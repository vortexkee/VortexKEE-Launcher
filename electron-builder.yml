appId: app.vercel.vlauncher
productName: Vortex Launcher
copyright: Copyright © 2026 Vortex Launcher

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

asar: true

publish:
  - provider: github
    releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vortex Launcher

mac:
  category: public.app-category.games
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  category: Game
  maintainer: Vortex Launcher <https://vlauncher.vercel.app>
  synopsis: Cross-platform custom Minecraft Launcher (Vortex Launcher)
  desktop:
    Name: Vortex Launcher
    Comment: Cross-platform modern Minecraft Launcher
    Categories: Game;
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
